name: Build LYNE for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - name: Locate LYNE project
        id: project
        shell: pwsh
        run: |
          $matches = Get-ChildItem -Path . -Filter package.json -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\\\](node_modules|.git)[\\\\]' } |
            Where-Object {
              try {
                $p = Get-Content $_.FullName -Raw | ConvertFrom-Json
                $p.scripts.'electron:build:win'
              } catch { $false }
            }

          $package = $matches | Select-Object -First 1
          if (-not $package) {
            throw "Could not find LYNE package.json with electron:build:win script."
          }

          $dir = $package.Directory.FullName
          "app_dir=$dir" >> $env:GITHUB_OUTPUT
          Write-Host "Using project directory: $dir"
          Write-Host "package.json: $($package.FullName)"
          if (-not (Test-Path (Join-Path $dir 'pnpm-lock.yaml'))) {
            Write-Host "No pnpm-lock.yaml found beside package.json."
          }

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.app_dir }}
        run: pnpm install --no-frozen-lockfile

      - name: Build LYNE installer
        working-directory: ${{ steps.project.outputs.app_dir }}
        run: pnpm electron:build:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: LYNE-Windows-Installer
          path: |
            ${{ steps.project.outputs.app_dir }}/release/*.exe
            ${{ steps.project.outputs.app_dir }}/release/*.blockmap
            ${{ steps.project.outputs.app_dir }}/release/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            ${{ steps.project.outputs.app_dir }}/release/*.exe
            ${{ steps.project.outputs.app_dir }}/release/*.blockmap
            ${{ steps.project.outputs.app_dir }}/release/latest.yml
